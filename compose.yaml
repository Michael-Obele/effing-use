name: effing-use

services:
  effing-use:
    build: .
    image: effing-use:local
    # Playwright docs: --init avoids PID=1 zombie issues, --ipc=host keeps
    # Chromium from crashing on low /dev/shm. Streamable HTTP transport:
    # published port, no stdin/TTY needed.
    init: true
    ipc: host
    # Restart across daemon restarts / host reboots (compose must have been
    # started at least once with `up -d`; Docker then keeps it alive)
    restart: unless-stopped
    ports:
      # Host port is configurable: EFFING_PORT=3123 docker compose up
      # (container always listens on 3123 internally, so only the
      # left-hand side changes — healthcheck and app config stay as-is)
      - "${EFFING_PORT:-3123}:3123"
    environment:
      PORT: "3123"
      BROWSER_HEADLESS: "true"
      BROWSER_VIEWPORT_W: "1280"
      BROWSER_VIEWPORT_H: "800"
      BROWSER_TIMEOUT_MS: "15000"
      OUTPUT_DIR: /app/.browser-use
      OUTPUT_MAX_CHARS: "4000"
      ALLOW_EVAL: "false"
      # Loopback bridge (src/browser/bridge.ts). Lets the container open
      # http://localhost:<port> for a dev server bound to 127.0.0.1 on the
      # host, WITHOUT editing the app's vite.config.ts. The bridge splices
      # container loopback -> host.docker.internal and rewrites the HTTP
      # Host: header back to localhost so Vite >=6 `server.allowedHosts`
      # accepts it. Set to "0" to disable, or override the gateway host.
      EFFING_BRIDGE: "1"
    extra_hosts:
      # Required on Linux engines (no built-in host.docker.internal). On
      # Docker Desktop this is a no-op — the name already resolves.
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist snapshots / screenshots / PDFs on the host for inspection
      - ./.browser-use:/app/.browser-use
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3123/healthz').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
