name: effing-use

services:
  computer-use:
    build: .
    image: effing-use:local
    # Playwright docs: --init avoids PID=1 zombie issues, --ipc=host keeps
    # Chromium from crashing on low /dev/shm. Streamable HTTP transport:
    # published port, no stdin/TTY needed.
    init: true
    ipc: host
    # Restart across daemon restarts / host reboots (compose must have been
    # started at least once with `up -d`; Docker then keeps it alive)
    restart: unless-stopped
    ports:
      # Host port is configurable: ECU_PORT=3123 docker compose up
      # (container always listens on 3000 internally, so only the
      # left-hand side changes — healthcheck and app config stay as-is)
      - "${ECU_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      BROWSER_HEADLESS: "true"
      BROWSER_VIEWPORT_W: "1280"
      BROWSER_VIEWPORT_H: "800"
      BROWSER_TIMEOUT_MS: "15000"
      OUTPUT_DIR: /app/.browser-use
      OUTPUT_MAX_CHARS: "4000"
      ALLOW_EVAL: "false"
    volumes:
      # Persist snapshots / screenshots / PDFs on the host for inspection
      - ./.browser-use:/app/.browser-use
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
