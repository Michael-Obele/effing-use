name: effing-use

services:
  effing-use:
    build: .
    image: effing-use:local
    # Playwright docs: --init avoids PID=1 zombie issues, --ipc=host keeps
    # Chromium from crashing on low /dev/shm. Streamable HTTP transport:
    # published port, no stdin/TTY needed.
    init: true
    ipc: host
    # Restart across daemon restarts / host reboots (compose must have been
    # started at least once with `up -d`; Docker then keeps it alive)
    restart: unless-stopped
    ports:
      # Host port is configurable: EFFING_PORT=3123 docker compose up
      # (container always listens on 3123 internally, so only the
      # left-hand side changes — healthcheck and app config stay as-is)
      - "${EFFING_PORT:-3123}:3123"
    # Cap the blast radius: without limits one heavy page (software GL +
    # 4 raster threads fanning out over the host) can sit at 400%+ and push
    # host load past core count. 2 CPUs is plenty for an agent browser;
    # raise to 4 if full-page screenshots feel slow.
    cpus: "2.0"
    mem_limit: 2g
    environment:
      PORT: "3123"
      BROWSER_HEADLESS: "true"
      BROWSER_VIEWPORT_W: "1280"
      BROWSER_VIEWPORT_H: "800"
      BROWSER_TIMEOUT_MS: "30000"
      OUTPUT_DIR: /app/.browser-use
      OUTPUT_MAX_CHARS: "4000"
      ALLOW_EVAL: "false"
      # Idle lifecycle: close sessions after 5 min idle, close the whole
      # browser after 10 min with no sessions. The next tool call relaunches
      # transparently. Set to "0" to disable (not recommended in Docker).
      EFFING_IDLE_TTL_MS: "300000"
      EFFING_BROWSER_TTL_MS: "600000"
      # Asset blocking: abort font + media requests (webfonts, video, audio).
      # Big CPU win on ad/media-heavy pages; screenshots keep images.
      # Use "image,font,media" for max savings, "none" to disable.
      EFFING_BLOCK_ASSETS: "font,media"
      # Reduced motion: tell pages to skip animations (plus Chromium flag).
      # Set to "0" only if testing animations themselves.
      EFFING_REDUCED_MOTION: "1"
      # Snapshot settle: how long to wait for networkidle after a navigation
      # before snapshotting. Tracker-heavy pages always burn the full window.
      EFFING_SETTLE_IDLE_MS: "800"
      # DOM read cap for change detection (layout-free textContent).
      EFFING_DOM_CAP: "20000"
      # Loopback bridge (src/browser/bridge.ts). Lets the container open
      # http://localhost:<port> for a dev server bound to 127.0.0.1 on the
      # host, WITHOUT editing the app's vite.config.ts. The bridge splices
      # container loopback -> host.docker.internal and rewrites the HTTP
      # Host: header back to localhost so Vite >=6 `server.allowedHosts`
      # accepts it. Set to "0" to disable, or override the gateway host.
      EFFING_BRIDGE: "1"
    extra_hosts:
      # Required on Linux engines (no built-in host.docker.internal). On
      # Docker Desktop this is a no-op — the name already resolves.
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist snapshots / screenshots / PDFs on the host for inspection
      - ./.browser-use:/app/.browser-use
    healthcheck:
      # curl, not `bun -e`: spawning a full Bun runtime every 10s costs CPU
      # on every check. curl is already in the Playwright base image.
      # 30s interval: this is a local agent browser, not a public service.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3123/healthz > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
