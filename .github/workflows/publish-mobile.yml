name: Publish mobile to npm

# Separate package, separate tag namespace: `mobile-v0.1.0` publishes
# effing-use-mobile and never touches the browser package.
on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publishing: OIDC token npm exchanges for a publish

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing needs npm >= 11.5.1 and registry-url must be set so
      # setup-node writes the .npmrc auth config.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A release tag must match the package version, or the tag and the
      # published tarball silently disagree.
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#mobile-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag mobile-v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Publish
        run: npm publish --provenance --access public
