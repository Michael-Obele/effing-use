name: Docker

# Builds the container image and publishes it to GHCR + Docker Hub.
# - Tags v* / manual dispatch → push multi-arch (amd64+arm64) images
# - Pushes to master / PRs   → amd64 build-only (validates the Dockerfile)
# Docker Hub needs DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (PAT) secrets — without
# them only GHCR is pushed. On first Hub push the repo is created and its
# short description + full description (this repo's README) are set for you.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io + best-effort package visibility change

env:
  IMAGE_NAME: effing-use
  HUB_SHORT_DESC: >-
    Token-efficient 3-tool browser control for AI agents — MCP server + CLI on
    Playwright

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      # Same guard as publish.yml: a release tag must match package.json
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      # Release tags + manual dispatch push images; branch/PR runs only build.
      - name: Decide push targets
        id: decide
        run: |
          PUSH=false
          PLATFORMS="linux/amd64"
          if { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; } \
             || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PUSH=true
            PLATFORMS="linux/amd64,linux/arm64"
          fi
          OWNER_LC="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGES="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            IMAGES="${IMAGES}"$'\n'"${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          else
            echo "::notice::Docker Hub secrets not set — pushing to GHCR only"
          fi
          {
            echo "push=${PUSH}"
            echo "platforms=${PLATFORMS}"
            echo "images<<EOF"
            echo "$IMAGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64)
        if: steps.decide.outputs.push == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.decide.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.decide.outputs.push == 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.decide.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.decide.outputs.platforms }}
          push: ${{ steps.decide.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Create the Docker Hub repo on first push and keep its details in sync:
      # short description above + full description = this repo's README.
      - name: Ensure Docker Hub repo + description/README/topics
        if: steps.decide.outputs.push == 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          GH_SHORT: ${{ env.HUB_SHORT_DESC }}
        run: |
          set -euo pipefail
          # Hub API auth: PAT works directly as a Bearer token; fall back to the
          # login endpoint if it doesn't (keeps this step from hard-failing).
          JWT="$DOCKERHUB_TOKEN"
          if ! curl -sf -H "Authorization: Bearer $JWT" \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/" \
              >/dev/null 2>&1; then
            GOT=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
              -H 'Content-Type: application/json' \
              -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
              | jq -r '.token // empty')
            [ -n "$GOT" ] && JWT="$GOT"
          fi
          AUTH=(-H "Authorization: Bearer ${JWT}" -H 'Content-Type: application/json')

          CODE=$(curl -s -o /dev/null -w '%{http_code}' "${AUTH[@]}" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/")
          if [ "$CODE" = "404" ]; then
            jq -n --arg ns "$DOCKERHUB_USERNAME" --arg n "$IMAGE_NAME" \
                  --arg d "$GH_SHORT" --rawfile rd README.md \
                  '{namespace:$ns,name:$n,description:$d,full_description:$rd,is_private:false}' \
            | curl -sf "${AUTH[@]}" -X POST \
                "https://hub.docker.com/v2/namespaces/${DOCKERHUB_USERNAME}/repositories" \
                -d @- >/dev/null
            echo "Created docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME} with README as full description"
          else
            jq -n --arg d "$GH_SHORT" --rawfile rd README.md \
                  '{description:$d,full_description:$rd}' \
            | curl -s "${AUTH[@]}" -X PATCH \
                "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/" \
                -d @- >/dev/null || true
            echo "Synced description + README (best effort)"
          fi
          jq -n '{topics:["mcp","browser-automation","playwright","ai-agents","cli","token-efficiency","bun"]}' \
          | curl -s "${AUTH[@]}" -X PUT \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/topics/" \
              -d @- >/dev/null || true

      # GHCR packages default to private; the OCI source label (set by
      # metadata-action) links the package to this repo so the token may flip it.
      - name: Make GHCR package public (best effort)
        if: steps.decide.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "/user/packages/container/${IMAGE_NAME}" \
            -f visibility=public 2>/dev/null \
          || echo "::warning::Could not set ghcr.io package visibility — set it to public manually (package page → Package settings)"
