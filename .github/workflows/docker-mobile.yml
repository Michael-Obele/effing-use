name: Docker mobile

# Builds the effing-use-mobile image and publishes it to GHCR + Docker Hub.
# - Tags mobile-v* / manual dispatch → push multi-arch (amd64+arm64)
# - Pushes to master / PRs that touch mobile/** → amd64 build-only (validates
#   the Dockerfile without publishing)
on:
  push:
    branches: [master]
    tags: ["mobile-v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/docker-mobile.yml"
  pull_request:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/docker-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: effing-use-mobile
  HUB_SHORT_DESC: >-
    Token-efficient Android/Capacitor WebView control for AI agents — 3-tool MCP
    server over adb + CDP

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#mobile-v}"
          PKG="$(node -p "require('./mobile/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag mobile-v${TAG} does not match mobile/package.json version ${PKG}"
            exit 1
          fi

      - name: Setup QEMU (multi-arch)
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_TOKEN != '' && format('docker.io/{0}/{1}', env.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            type=semver,pattern={{version}},prefix=
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mobile
          file: ./mobile/Dockerfile
          platforms: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mobile
          cache-to: type=gha,mode=max,scope=mobile
