name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required: lets GitHub mint the OIDC token npm exchanges for publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Project uses Bun (bun.lock, not package-lock.json) — install deps with bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing needs npm >= 11.5.1; Node 24 ships an older bundled
      # npm, so we upgrade it below. registry-url is REQUIRED even though it's
      # the default — it makes setup-node write the .npmrc auth config.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      - name: Ensure latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun check

      - name: Test
        run: bun test

      # Tag pushes must match package.json version (prevents accidental publishes)
      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      # No NODE_AUTH_TOKEN needed — npm exchanges the GitHub OIDC token for a
      # short-lived npm token (Trusted Publisher configured on npmjs.com).
      # publishConfig.provenance + --provenance attach sigstore attestations.
      - name: Publish to npm
        run: npm publish --provenance --access public